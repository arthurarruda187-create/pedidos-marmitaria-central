<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex">
<title>Minhas entregas</title>
<link rel="manifest" href="./entregador.webmanifest">
<link rel="apple-touch-icon" href="icones/painel-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entregas">
<style>
  :root { --cor: #e4002b; --ok: #16a34a; --linha: #e5e7eb; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f3f4f6; color: #111827; }
  header { background: #111827; color: #fff; padding: 1rem 1rem .9rem; position: sticky; top: 0; z-index: 2; }
  header h1 { margin: 0; font-size: 1.15rem; }
  header small { color: #d1d5db; }
  main { padding: .8rem; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; padding: .9rem; margin-bottom: .8rem; box-shadow: 0 1px 3px #0001; }
  .topo { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .num { font-size: 1.35rem; font-weight: 800; }
  .selo { font-size: .75rem; font-weight: 700; border-radius: 99px; padding: .15rem .55rem; background: #eef2ff; color: #3730a3; }
  .st { font-size: .8rem; font-weight: 700; border-radius: 6px; padding: .15rem .5rem; }
  .st.saiu { background: #fef3c7; color: #92400e; } .st.pronto { background: #dcfce7; color: #166534; } .st.preparo { background: #e0e7ff; color: #3730a3; }
  .linha { margin-top: .45rem; }
  .end { font-weight: 700; font-size: 1.05rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .pag { margin-top: .6rem; padding: .55rem .7rem; border-radius: 10px; font-weight: 700; }
  .pag.cobrar { background: #fef2f2; color: #991b1b; } .pag.pago { background: #f0fdf4; color: #166534; }
  .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .7rem; }
  .btn { display: flex; align-items: center; justify-content: center; gap: .35rem; border: 0; border-radius: 12px; padding: .8rem; font: 700 1rem system-ui; text-decoration: none; cursor: pointer; }
  .btn.sec { background: #f3f4f6; color: #111827; } .btn.pri { background: var(--cor); color: #fff; } .btn.ok { background: var(--ok); color: #fff; }
  .btn:disabled { opacity: .55; }
  .full { grid-column: 1 / -1; }
  .codigo { display: flex; gap: .5rem; margin-top: .7rem; }
  .codigo input { flex: 1; min-width: 0; font: 800 1.6rem ui-monospace, monospace; letter-spacing: .5rem; text-align: center; padding: .55rem; border: 2px solid var(--linha); border-radius: 12px; }
  .codigo input:focus { outline: none; border-color: var(--ok); }
  .erro { color: #b91c1c; font-weight: 600; font-size: .92rem; margin-top: .4rem; min-height: 1em; }
  .vazio { text-align: center; color: var(--muted); padding: 3rem 1rem; }
  .feito { text-align: center; padding: .6rem; color: var(--ok); font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); background: #111827; color: #fff; padding: .7rem 1rem; border-radius: 12px; font-weight: 600; z-index: 9; }
  .oculto { display: none !important; }
  .rota { margin-bottom: .8rem; } .rota .btn { width: 100%; font-size: 1.05rem; padding: .9rem; }
</style>
</head>
<body>
<header><h1 id="titulo">Minhas entregas</h1><small id="sub">Carregando…</small>
  <button id="btnInstalar" class="oculto" style="margin-top:.5rem;border:0;border-radius:10px;padding:.5rem .8rem;background:#fff;color:#111827;font-weight:700">📲 Instalar o app no celular</button></header>
<main id="lista"></main>
<script type="module">
import { sb, SUPABASE_URL, SUPABASE_ANON_KEY, brl, esc, NOMES_PAGAMENTO, foneWhats, foneBonito } from "./comum.js";

import { ligarBotaoInstalar } from "./app.js";
// o link da loja traz o código do entregador (?t=...). Guardamos no celular para o app instalado abrir direto.
const daUrl = new URLSearchParams(location.search).get("t") || "";
let salvo = ""; try { salvo = localStorage.getItem("entregadorToken") || ""; } catch {}
const token = daUrl || salvo;
if (daUrl && daUrl !== salvo) { try { localStorage.setItem("entregadorToken", daUrl); } catch {} }
ligarBotaoInstalar(document.getElementById("btnInstalar"), "o app de entregas");
const NOMES_CANAL = { cardapio: "Cardápio", balcao: "Balcão", ifood: "iFood", aiqfome: "aiqfome", keeta: "Keeta", "99food": "99Food" };
const NOMES_ST = { preparo: "Em preparo", pronto: "Pronto", saiu: "Saiu" };
const toast = (t) => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); };
let dados = null, ocupado = false;

async function carregar() {
  if (ocupado) return;
  const { data, error } = await sb.rpc("entregador_dados", { p_token: token });
  if (error) { document.getElementById("sub").textContent = "Sem internet — tentando de novo…"; return; }
  if (!data) { document.getElementById("lista").innerHTML = `<div class="vazio">Link inválido ou desativado.<br>Peça um link novo para a loja.</div>`; document.getElementById("sub").textContent = ""; return; }
  dados = data; desenhar();
}

function pagamento(p) {
  if (p.pagamento_status === "pago" || p.pagamento === "pago_app") return `<div class="pag pago">✓ Já pago — não cobrar</div>`;
  if (p.pagamento === "dinheiro") {
    const troco = p.troco_para ? Number(p.troco_para) - Number(p.total) : 0;
    return `<div class="pag cobrar">💵 Receber ${brl(p.total)} em dinheiro${troco > 0 ? `<br><small>Troco para ${brl(p.troco_para)}: levar ${brl(troco)}</small>` : ""}</div>`;
  }
  return `<div class="pag cobrar">Receber ${brl(p.total)} · ${esc(NOMES_PAGAMENTO[p.pagamento] || p.pagamento)}</div>`;
}

function desenhar() {
  document.getElementById("titulo").textContent = `🛵 ${dados.nome}`;
  document.getElementById("sub").textContent = `${dados.loja} · ${dados.feitos_hoje} entrega(s) hoje`;
  const ps = dados.pedidos;
  const el = document.getElementById("lista");
  if (!ps.length) { el.innerHTML = `<div class="vazio">Nenhuma entrega com você agora. 🙌<br><small>A tela atualiza sozinha.</small></div>`; return; }
  const aSair = ps.filter((p) => p.status !== "saiu");
  el.innerHTML = (aSair.length > 1 || (aSair.length === 1 && ps.length > 1) ? `<div class="rota"><button class="btn pri full" id="sairRota">🛵 Saí para rota — ${aSair.length} pedido${aSair.length === 1 ? "" : "s"}</button>
      <div class="muted" style="margin-top:.3rem;text-align:center">Marca a saída de todas as entregas que estão com você agora</div></div>` : "") + ps.map((p) => {
    const mapa = p.lat != null ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.endereco || "") + " " + (p.bairro || ""))}`;
    const bloq = p.bloqueado_ate && new Date(p.bloqueado_ate) > new Date();
    return `<div class="card" data-id="${p.id}">
      <div class="topo"><span class="num">#${p.numero}</span><span style="display:flex;gap:.3rem">${p.canal !== "cardapio" ? `<span class="selo">${esc(NOMES_CANAL[p.canal] || p.canal)}${p.id_externo ? " " + esc(p.id_externo) : ""}</span>` : ""}<span class="st ${p.status}">${NOMES_ST[p.status] || p.status}</span></span></div>
      <div class="linha"><b>${esc(p.cliente_nome)}</b> <span class="muted">· ${p.qtd_itens} item(ns)</span></div>
      <div class="linha end">📍 ${esc(p.endereco || "")}${p.bairro ? ` — ${esc(p.bairro)}` : ""}</div>
      ${p.observacao ? `<div class="linha muted">📝 ${esc(p.observacao)}</div>` : ""}
      ${pagamento(p)}
      <div class="botoes">
        <a class="btn sec" href="${mapa}" target="_blank" rel="noopener">🗺️ Mapa</a>
        ${p.cliente_telefone ? `<a class="btn sec" href="https://wa.me/${foneWhats(p.cliente_telefone)}" target="_blank" rel="noopener">💬 ${esc(foneBonito(p.cliente_telefone))}</a>` : `<span></span>`}
        ${p.status !== "saiu" ? `<button class="btn pri full" data-saiu>🛵 Saí para entrega</button>` : ""}
      </div>
      ${p.status === "saiu" || p.status === "pronto" ? (p.tem_codigo ? `
        <div class="codigo"><input inputmode="numeric" maxlength="6" placeholder="código" autocomplete="off" ${bloq ? "disabled" : ""}><button class="btn ok" data-fim ${bloq ? "disabled" : ""}>✅ Finalizar</button></div>
        <div class="muted" style="margin-top:.3rem">Peça ao cliente o código de entrega (aparece no celular dele).</div>`
        : `<div class="botoes"><button class="btn ok full" data-fim>✅ Entreguei</button></div>`) : ""}
      <div class="erro">${bloq ? "Muitas tentativas erradas. Espere alguns minutos ou peça para a loja finalizar." : ""}</div>
    </div>`;
  }).join("");
  el.querySelectorAll("[data-saiu]").forEach((b) => b.onclick = () => saiu(b.closest(".card").dataset.id, b));
  const rota = document.getElementById("sairRota");
  if (rota) rota.onclick = () => sairRota(aSair, rota);
  el.querySelectorAll("[data-fim]").forEach((b) => b.onclick = () => finalizar(b.closest(".card"), b));
  el.querySelectorAll(".codigo input").forEach((i) => i.onkeydown = (e) => { if (e.key === "Enter") i.parentElement.querySelector("[data-fim]").click(); });
}

async function saiu(id, b) {
  b.disabled = true; ocupado = true;
  const { data, error } = await sb.rpc("entregador_saiu", { p_token: token, p_pedido: id });
  ocupado = false;
  if (error || data !== "ok") { b.disabled = false; return toast(error ? "Sem internet. Tente de novo." : data); }
  toast("Boa entrega! 🛵"); carregar();
}

// sai com todos os pedidos de uma vez (o cliente de cada um é avisado que saiu)
async function sairRota(lista, b) {
  if (b.dataset.conf !== "1") { b.dataset.conf = "1"; b.textContent = `Confirmar: sair com ${lista.length} pedido(s)?`; b.classList.add("ok"); setTimeout(() => { if (b.isConnected) desenhar(); }, 5000); return; }
  b.disabled = true; ocupado = true; b.textContent = "Saindo…";
  let ok = 0, erros = [];
  for (const p of lista) {
    const { data, error } = await sb.rpc("entregador_saiu", { p_token: token, p_pedido: p.id });
    if (!error && data === "ok") ok++; else erros.push(`#${p.numero}: ${error ? "sem internet" : data}`);
  }
  ocupado = false;
  toast(erros.length ? `Saíram ${ok}. Não deu: ${erros.join(", ")}` : `Boa rota! 🛵 ${ok} pedido${ok === 1 ? "" : "s"} saíram`);
  carregar();
}

async function finalizar(card, b) {
  const id = card.dataset.id, inp = card.querySelector(".codigo input"), erro = card.querySelector(".erro");
  const codigo = inp ? inp.value.replace(/\D/g, "") : "";
  if (inp && codigo.length < 4) { erro.textContent = "Digite o código que o cliente passou."; inp.focus(); return; }
  b.disabled = true; ocupado = true; erro.textContent = "";
  try {
    let { data, error } = await sb.rpc("entregador_finalizar", { p_token: token, p_pedido: id, p_codigo: codigo });
    if (error) throw error;
    if (data === "externo") { // pedido de app: o código é conferido no próprio app
      const r = await fetch(`${SUPABASE_URL}/functions/v1/integracoes`, { method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ acao: "verificar_codigo", token, pedido_id: id, codigo }) });
      const j = await r.json().catch(() => ({}));
      data = j.ok ? "ok" : (j.erro || "Não foi possível conferir o código no app.");
    }
    if (data !== "ok") { erro.textContent = data; b.disabled = false; inp?.select(); return; }
    card.innerHTML = `<div class="feito">✅ Pedido #${card.querySelector(".num")?.textContent?.replace("#", "") || ""} entregue!</div>`;
    toast("Entrega finalizada ✅");
    setTimeout(carregar, 1500);
  } catch { erro.textContent = "Sem internet. Tente de novo."; b.disabled = false; }
  finally { ocupado = false; }
}

if (!token) document.getElementById("lista").innerHTML = `<div class="vazio">Abra pelo link que a loja mandou.</div>`;
else { carregar(); setInterval(carregar, 20000); document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(); }); }
</script>
</body>
</html>
